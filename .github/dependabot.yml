version: 2
updates:
  # Maven dependencies for every module (aggregated by the root pom.xml)
  - package-ecosystem: maven
    directories:
      - "/"
      - "/customer-service"
      - "/spring-discovery-server"
      - "/spring-gateway"
      - "/spring-web"
      - "/spring-web-flux"
    schedule:
      interval: weekly
      day: monday
      time: '21:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: master
    assignees:
      - hendisantika
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
      include: scope
    groups:
      # Spring Boot & Spring Cloud must move together (release-train compatibility)
      spring:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.cloud:*"
      jwt:
        patterns:
          - "io.jsonwebtoken:*"
      maven-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "org.springframework.boot:*"
          - "org.springframework.cloud:*"
          - "io.jsonwebtoken:*"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: '21:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    target-branch: master
    assignees:
      - hendisantika
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
